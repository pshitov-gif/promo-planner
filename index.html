const ROLES={"r1":"Промо","r2":"Бренд","r3":"Студия","r4":"CMO","r5":"SMM","r6":"CRM","r7":"Коммерция","r8":"B2B Marketing","r9":"Legal","r10":"Финком","r11":"PR","r12":"Офлайн маркетинг","r13":"КМ"};
const ROLE_COL={r1:'#5b4df5',r2:'#e55d45',r3:'#2b9d79',r4:'#1f2937',r5:'#c06bd3',r6:'#2e7bc4',r7:'#d89419',r8:'#7a8a96',r9:'#bc4c72',r10:'#4958c8',r11:'#168c91',r12:'#9370db',r13:'#b46c28'};
const STORE='promo-planner-v2';
const clone=o=>JSON.parse(JSON.stringify(o));
function initState(){let s;try{s=JSON.parse(localStorage.getItem(STORE)||'null')}catch{};if(!s||!s.templates){s={templates:clone(SEED),plans:[],updatedAt:Date.now()};save(s)}return s}
let state=initState(), route={screen:'home'}, undo=[];
function save(s=state){localStorage.setItem(STORE,JSON.stringify(s));}
function snapshot(){undo.push(JSON.stringify(state));if(undo.length>80)undo.shift()}
function doUndo(){if(!undo.length)return;state=JSON.parse(undo.pop());save();render()}
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();doUndo()}});
const fmtDate=iso=>{if(!iso)return'—';return new Date(iso+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})};
const addDays=(iso,n)=>{let d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+Number(n));return d.toISOString().slice(0,10)};
const tLabel=n=>n===0?'T0':n<0?`T−${Math.abs(n)}`:`T+${n}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function nav(screen,extra={}){route={screen,...extra};undo=[];render()}
function current(){if(route.screen==='plan')return state.plans.find(x=>x.id===route.id);if(route.screen==='template')return state.templates[route.key];return null}
function topbar(title,back=true){return `<div class=top>${back?'<button class="btn iconbtn" data-act=back>←</button>':''}<div class=brand>${esc(title)}</div><div class=spacer></div>${route.screen==='plan'||route.screen==='template'?'<button class=btn data-act=undo>↶ Отменить</button>':''}</div>`}
function render(){const a=document.getElementById('app');if(route.screen==='home')a.innerHTML=home();else if(route.screen==='admin')a.innerHTML=admin();else if(route.screen==='plan'||route.screen==='template')a.innerHTML=editor();bind()}
function home(){const cards=state.plans.length?state.plans.slice().sort((a,b)=>b.updatedAt-a.updatedAt).map(p=>`<div class=planCard data-open-plan="${p.id}"><h3>${esc(p.name)}</h3><div class=meta><span>${esc(p.scenarioLabel)}</span><span>Старт: ${fmtDate(p.startDate)}</span><span>${p.tasks.length} этапов</span></div></div>`).join(''):`<div class=empty>Пока нет сохранённых планов. Создай первый.</div>`;return `${topbar('Promo Planner',false)}<div style="display:flex;align-items:end;gap:12px;margin-bottom:18px"><div><h1 class=pageTitle>Планы промо</h1><p class=sub>Рабочие планы создаются из шаблонов и дальше живут независимо.</p></div><div class=spacer></div><button class=btn data-act=admin>Администрирование</button><button class="btn primary" data-act=create>+ Создать новый план</button></div><div class=cards>${cards}</div>`}
function admin(){return `${topbar('Администрирование')}<h1 class=pageTitle>Шаблоны флоу</h1><p class=sub>Из этих шаблонов создаются все новые планы. Изменения не затрагивают уже созданные планы.</p><div class=cards>${Object.entries(state.templates).map(([k,t])=>`<div class=planCard data-open-template="${k}"><h3>${esc(t.label)}</h3><div class=meta><span>${t.groups.length} групп</span><span>${t.tasks.length} этапов</span></div></div>`).join('')}</div>`}
function editor(){const d=current();if(!d)return '<p>Не найдено</p>';const isTpl=route.screen==='template', title=isTpl?`Шаблон: ${d.label}`:d.name;const view=route.view||'gantt';const team=route.team||'';return `${topbar(title)}<div style="display:flex;align-items:end;gap:12px"><div><h1 class=pageTitle>${esc(title)}</h1><p class=sub>${isTpl?'Нормативный шаблон. Все сроки указаны относительно T0.':`${esc(d.scenarioLabel)} · плановый старт ${fmtDate(d.startDate)}`}</p></div><div class=spacer></div>${isTpl?'<button class=btn data-act=add-group>+ Группа</button>':''}<button class=btn data-act=add-task>+ Этап</button></div><div class=toolbar><div class=seg><button data-view=gantt class="${view==='gantt'?'on':''}">Гант</button><button data-view=table class="${view==='table'?'on':''}">Таблица</button></div><input class=search id=search placeholder="Поиск по этапам" value="${esc(route.search||'')}"><button class="chip ${!team?'on':''}" data-team="">Все команды</button>${Object.entries(ROLES).map(([id,n])=>`<button class="chip ${team===id?'on':''}" data-team="${id}">${esc(n)}</button>`).join('')}</div>${view==='table'?tableView(d):ganttView(d)}`}
function visibleTasks(d){const q=(route.search||'').toLowerCase(),team=route.team||'';return d.tasks.filter(t=>(!q||t.name.toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q))&&(!team||(t.own||[]).includes(team)))}
function tableView(d){const vis=visibleTasks(d), by=Object.fromEntries(d.groups.map(g=>[g.id,[]]));vis.forEach(t=>(by[t.groupId]||(by[t.groupId]=[])).push(t));let rows='';d.groups.forEach(g=>{rows+=`<tr class=groupRow draggable=true data-drag-group="${g.id}"><td class=drag>⋮⋮</td><td colspan=7>${esc(g.name)}</td></tr>`;(by[g.id]||[]).forEach(t=>rows+=`<tr draggable=true data-drag-task="${t.id}" data-group="${g.id}"><td class=drag>⋮⋮</td><td class=taskName data-edit="${t.id}"><b>${esc(t.name)}</b><div class=small>${esc((t.own||[]).map(x=>ROLES[x]).join(' + '))}</div></td><td>${tLabel(t.os)}</td><td>${tLabel(t.oe)}</td><td>${d.startDate?fmtDate(addDays(d.startDate,t.os)):'—'}</td><td>${d.startDate?fmtDate(addDays(d.startDate,t.oe)):'—'}</td><td>${esc((t.deps||[]).length?String(t.deps.length):'—')}</td><td><button class=btn data-edit="${t.id}">Изменить</button></td></tr>`) });return `<div class="panel tableWrap"><table class=tbl><thead><tr><th></th><th>Этап</th><th>Начало</th><th>Конец</th><th>Дата начала</th><th>Дата конца</th><th>Зависимости</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}
function ganttView(d){const vis=visibleTasks(d);let min=Math.min(-10,...d.tasks.map(t=>t.os))-5,max=Math.max(10,...d.tasks.map(t=>t.oe))+5,total=max-min,track=total*14;let ticks='';for(let x=Math.ceil(min/7)*7;x<=max;x+=7)ticks+=`<div class="tick ${x===0?'zero':''}" style="left:${(x-min)*14}px">${tLabel(x)}</div>`;let rows='';d.groups.forEach(g=>{rows+=`<div class="gRow gGroup" draggable=true data-drag-group="${g.id}"><div class=gLeft>⋮⋮ &nbsp;${esc(g.name)}</div><div class=gTrack style="width:${track}px">${ticks}</div></div>`;vis.filter(t=>t.groupId===g.id).forEach(t=>{let left=(t.os-min)*14,w=Math.max(10,(t.oe-t.os+1)*14);let cols=(t.own||[]).map(x=>ROLE_COL[x]||'#6c7280'),bg=cols.length>1?`linear-gradient(90deg,${cols.map((c,i)=>`${c} ${i/cols.length*100}% ${(i+1)/cols.length*100}%`).join(',')})`:(cols[0]||'#6c7280');rows+=`<div class="gRow gTask" draggable=true data-drag-task="${t.id}" data-group="${g.id}"><div class=gLeft><span class=drag>⋮⋮</span><span data-edit="${t.id}" style="cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.name)}</span></div><div class=gTrack style="width:${track}px">${ticks}<div class=bar data-bar="${t.id}" style="left:${left}px;width:${w}px;background:${bg}"><span class="handle l" data-resize=l></span><span class=barLabel>${esc(t.name)}</span><span class="handle r" data-resize=r></span></div></div></div>`})});return `<div class="panel gantt"><div class=gInner><div class=gHead><div class=gLeft><b>Этап / группа</b></div><div class="gTrack gAxis" style="width:${track}px">${ticks}</div></div>${rows}</div></div>`}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class=modalBack id=modalBack><div class=modal>${html}</div></div>`);bindModal()}
function createModal(){modal(`<h2>Новый план</h2><form id=createForm><div class=field><label>Название промо</label><input name=name required placeholder="Например, 11.11 2026"></div><div class=grid2><div class=field><label>Сценарий</label><select name=scenario>${Object.entries(state.templates).map(([k,t])=>`<option value="${k}">${esc(t.label)}</option>`).join('')}</select></div><div class=field><label>Плановая дата старта</label><input name=start type=date required></div></div><p class=notice>План получит копию текущего шаблона. Дальнейшие изменения шаблона его не изменят.</p><div class=modalActions><button class=btn type=button data-close>Отмена</button><button class="btn primary" type=submit>Создать</button></div></form>`)}
function editModal(id){const d=current(),t=d.tasks.find(x=>x.id===id);if(!t)return;modal(`<h2>Редактирование этапа</h2><form id=editForm data-id="${id}"><div class=field><label>Название</label><input name=name value="${esc(t.name)}" required></div><div class=field><label>Описание</label><textarea name=description>${esc(t.description||'')}</textarea></div><div class=grid2><div class=field><label>Группа</label><select name=groupId>${d.groups.map(g=>`<option value="${g.id}" ${g.id===t.groupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class=field><label>Основная команда</label><select name=r>${Object.entries(ROLES).map(([k,n])=>`<option value="${k}" ${k===t.r?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class=field><label>Начало относительно T0</label><input name=os type=number value="${t.os}"></div><div class=field><label>Конец относительно T0</label><input name=oe type=number value="${t.oe}"></div></div><div class=field><label>Команды</label><div class=checks>${Object.entries(ROLES).map(([k,n])=>`<label class=check><input type=checkbox name=own value="${k}" ${(t.own||[]).includes(k)?'checked':''}>${esc(n)}</label>`).join('')}</div></div><div class=field><label>Зависит от этапов</label><div class=depList>${d.tasks.filter(x=>x.id!==id).map(x=>`<label><input type=checkbox name=deps value="${x.id}" ${(t.deps||[]).includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}</div></div><div class=modalActions><button class="btn danger" type=button data-delete-task="${id}">Удалить</button><div class=spacer></div><button class=btn type=button data-close>Отмена</button><button class="btn primary" type=submit>Сохранить</button></div></form>`)}
function addTaskModal(){const d=current();modal(`<h2>Новый этап</h2><form id=addTaskForm><div class=field><label>Название</label><input name=name required></div><div class=grid2><div class=field><label>Группа</label><select name=groupId>${d.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class=field><label>Команда</label><select name=r>${Object.entries(ROLES).map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join('')}</select></div><div class=field><label>Начало</label><input type=number name=os value=-1></div><div class=field><label>Конец</label><input type=number name=oe value=-1></div></div><div class=modalActions><button class=btn type=button data-close>Отмена</button><button class="btn primary" type=submit>Добавить</button></div></form>`)}
function addGroupModal(){modal(`<h2>Новая группа</h2><form id=addGroupForm><div class=field><label>Название</label><input name=name required></div><div class=modalActions><button class=btn type=button data-close>Отмена</button><button class="btn primary" type=submit>Добавить</button></div></form>`)}
function closeModal(){document.getElementById('modalBack')?.remove()}
function bindModal(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);let cf=document.getElementById('createForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf),key=f.get('scenario'),tpl=clone(state.templates[key]),id='p'+Date.now();snapshot();state.plans.push({id,name:f.get('name'),scenario:key,scenarioLabel:tpl.label,startDate:f.get('start'),groups:tpl.groups,tasks:tpl.tasks,updatedAt:Date.now()});save();closeModal();nav('plan',{id,view:'gantt'})};let ef=document.getElementById('editForm');if(ef)ef.onsubmit=e=>{e.preventDefault();let d=current(),t=d.tasks.find(x=>x.id===ef.dataset.id),f=new FormData(ef);snapshot();t.name=f.get('name');t.description=f.get('description');t.groupId=f.get('groupId');t.r=f.get('r');t.os=Number(f.get('os'));t.oe=Number(f.get('oe'));if(t.oe<t.os)t.oe=t.os;t.own=f.getAll('own');if(!t.own.length)t.own=[t.r];t.deps=f.getAll('deps');touch(d);save();closeModal();render()};document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>{if(confirm('Удалить этап?')){let d=current();snapshot();d.tasks=d.tasks.filter(x=>x.id!==b.dataset.deleteTask);d.tasks.forEach(x=>x.deps=(x.deps||[]).filter(y=>y!==b.dataset.deleteTask));touch(d);save();closeModal();render()}});let af=document.getElementById('addTaskForm');if(af)af.onsubmit=e=>{e.preventDefault();let d=current(),f=new FormData(af),r=f.get('r');snapshot();d.tasks.push({id:'t'+Date.now(),name:f.get('name'),description:'',groupId:f.get('groupId'),r,own:[r],os:Number(f.get('os')),oe:Number(f.get('oe')),deps:[]});touch(d);save();closeModal();render()};let gf=document.getElementById('addGroupForm');if(gf)gf.onsubmit=e=>{e.preventDefault();let d=current(),f=new FormData(gf);snapshot();d.groups.push({id:'g'+Date.now(),name:f.get('name')});touch(d);save();closeModal();render()}}
function touch(d){if(route.screen==='plan')d.updatedAt=Date.now();state.updatedAt=Date.now()}
let dragInfo=null;
function bind(){document.querySelector('[data-act=back]')?.addEventListener('click',()=>nav(route.screen==='plan'?'home':'admin'));document.querySelector('[data-act=admin]')?.addEventListener('click',()=>nav('admin'));document.querySelector('[data-act=create]')?.addEventListener('click',createModal);document.querySelector('[data-act=undo]')?.addEventListener('click',doUndo);document.querySelector('[data-act=add-task]')?.addEventListener('click',addTaskModal);document.querySelector('[data-act=add-group]')?.addEventListener('click',addGroupModal);document.querySelectorAll('[data-open-plan]').forEach(x=>x.onclick=()=>nav('plan',{id:x.dataset.openPlan,view:'gantt'}));document.querySelectorAll('[data-open-template]').forEach(x=>x.onclick=()=>nav('template',{key:x.dataset.openTemplate,view:'gantt'}));document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{route.view=x.dataset.view;render()});document.querySelectorAll('[data-team]').forEach(x=>x.onclick=()=>{route.team=x.dataset.team;render()});let se=document.getElementById('search');if(se)se.oninput=()=>{route.search=se.value;clearTimeout(se._tm);se._tm=setTimeout(()=>{render();let n=document.getElementById('search');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},120)};document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=e=>{e.stopPropagation();editModal(x.dataset.edit)});bindDnD();bindBars()}
function bindDnD(){document.querySelectorAll('[data-drag-task]').forEach(row=>{row.addEventListener('dragstart',e=>{dragInfo={type:'task',id:row.dataset.dragTask};e.dataTransfer.effectAllowed='move'});row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();if(!dragInfo||dragInfo.type!=='task')return;let d=current(),src=d.tasks.find(x=>x.id===dragInfo.id),target=d.tasks.find(x=>x.id===row.dataset.dragTask);if(!src||!target||src.id===target.id)return;snapshot();src.groupId=target.groupId;d.tasks=d.tasks.filter(x=>x.id!==src.id);let i=d.tasks.findIndex(x=>x.id===target.id);d.tasks.splice(i,0,src);touch(d);save();render()})});document.querySelectorAll('[data-drag-group]').forEach(row=>{row.addEventListener('dragstart',e=>{if(e.target.closest('[data-drag-task]'))return;dragInfo={type:'group',id:row.dataset.dragGroup}});row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();let d=current();if(!dragInfo)return;if(dragInfo.type==='task'){let t=d.tasks.find(x=>x.id===dragInfo.id);if(t){snapshot();t.groupId=row.dataset.dragGroup;touch(d);save();render()}}else if(dragInfo.type==='group'&&dragInfo.id!==row.dataset.dragGroup){snapshot();let g=d.groups.find(x=>x.id===dragInfo.id),arr=d.groups.filter(x=>x.id!==dragInfo.id),i=arr.findIndex(x=>x.id===row.dataset.dragGroup);arr.splice(i,0,g);d.groups=arr;touch(d);save();render()}})})}
function bindBars(){const tip=document.getElementById('tip');document.querySelectorAll('[data-bar]').forEach(bar=>{let id=bar.dataset.bar;bar.addEventListener('mouseenter',e=>{let d=current(),t=d.tasks.find(x=>x.id===id);tip.innerHTML=`<b>${esc(t.name)}</b><br>${tLabel(t.os)} → ${tLabel(t.oe)} · ${esc((t.own||[]).map(x=>ROLES[x]).join(' + '))}`;tip.hidden=false});bar.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px'});bar.addEventListener('mouseleave',()=>tip.hidden=true);bar.addEventListener('click',e=>{if(e.target.dataset.resize)return;editModal(id)});bar.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();let d=current(),t=d.tasks.find(x=>x.id===id),mode=e.target.dataset.resize||'move',sx=e.clientX,os=t.os,oe=t.oe,last=0,snapped=false;bar.setPointerCapture(e.pointerId);let move=ev=>{let dd=Math.round((ev.clientX-sx)/14);if(dd===last)return;last=dd;if(!snapped){snapshot();snapped=true}if(mode==='move'){t.os=os+dd;t.oe=oe+dd}else if(mode==='l'){t.os=Math.min(oe,os+dd)}else t.oe=Math.max(os,oe+dd);let left=(t.os-(Math.min(-10,...d.tasks.map(x=>x.os))-5))*14,w=Math.max(10,(t.oe-t.os+1)*14);bar.style.left=left+'px';bar.style.width=w+'px'};let up=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);if(snapped){touch(d);save();render()}};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up)})})}
render();
</script></body></html>
